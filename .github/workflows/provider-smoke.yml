name: Provider smoke test

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Sandbox provider to exercise
        required: true
        type: choice
        options:
          - e2b
          - vercel
      confirm_external_costs:
        description: I understand this may create billable external sandbox usage
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke:
    if: inputs.confirm_external_costs == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SANDBOX_PROVIDER: ${{ inputs.provider }}
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Require provider credentials
        shell: bash
        run: |
          set -euo pipefail
          case "${SANDBOX_PROVIDER}" in
            e2b)
              test -n "${E2B_API_KEY}" || {
                echo "E2B_API_KEY secret is required." >&2
                exit 2
              }
              ;;
            vercel)
              test -n "${VERCEL_TOKEN}" || {
                echo "VERCEL_TOKEN secret is required." >&2
                exit 2
              }
              test -n "${VERCEL_TEAM_ID}" || {
                echo "VERCEL_TEAM_ID secret is required." >&2
                exit 2
              }
              test -n "${VERCEL_PROJECT_ID}" || {
                echo "VERCEL_PROJECT_ID secret is required." >&2
                exit 2
              }
              ;;
            *)
              echo "Unsupported provider: ${SANDBOX_PROVIDER}" >&2
              exit 2
              ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start application
        shell: bash
        run: |
          set -euo pipefail
          npm start > /tmp/open-lovable-server.log 2>&1 &
          echo $! > /tmp/open-lovable-server.pid

          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done

          cat /tmp/open-lovable-server.log >&2 || true
          echo "Application did not become ready." >&2
          exit 3

      - name: Exercise workspace sandbox lifecycle
        shell: bash
        run: |
          set -euo pipefail

          workspace="provider-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base="http://127.0.0.1:3000"
          header="X-Open-Lovable-Workspace: ${workspace}"

          cleanup() {
            curl --silent --show-error               -X POST               -H "${header}"               "${base}/api/kill-sandbox"               >/tmp/provider-smoke-kill.json 2>/tmp/provider-smoke-kill.err || true
          }
          trap cleanup EXIT

          curl --fail-with-body --silent --show-error             -X POST             -H "${header}"             "${base}/api/create-ai-sandbox-v2"             > /tmp/provider-smoke-create.json

          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/provider-smoke-create.json').read_text())
          assert data.get('success') is True, data
          assert data.get('sandboxId'), data
          assert data.get('url'), data
          print('create: PASS', data.get('sandboxId'))
          PY

          curl --fail-with-body --silent --show-error             -H "${header}"             "${base}/api/sandbox-status"             > /tmp/provider-smoke-status.json

          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/provider-smoke-status.json').read_text())
          assert data.get('success') is True, data
          assert data.get('active') is True, data
          assert data.get('healthy') is True, data
          print('status: PASS')
          PY

          curl --fail-with-body --silent --show-error             -H "${header}"             "${base}/api/get-sandbox-files"             > /tmp/provider-smoke-files.json

          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/provider-smoke-files.json').read_text())
          assert data.get('success') is True, data
          assert isinstance(data.get('files'), dict), data
          print('files: PASS', data.get('fileCount'))
          PY

          curl --fail-with-body --silent --show-error             -X POST             -H "${header}"             -H 'Content-Type: application/json'             --data '{"command":"printf open-lovable-provider-smoke"}'             "${base}/api/run-command-v2"             > /tmp/provider-smoke-command.json

          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/provider-smoke-command.json').read_text())
          assert data.get('success') is True, data
          assert 'open-lovable-provider-smoke' in (data.get('output') or ''), data
          print('command: PASS')
          PY

          cleanup
          trap - EXIT

          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/provider-smoke-kill.json').read_text())
          assert data.get('success') is True, data
          assert data.get('localStateCleared') is True, data
          print('kill: PASS')
          PY

      - name: Collect smoke diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke-artifacts
          cp /tmp/open-lovable-server.log smoke-artifacts/server.log 2>/dev/null || true
          for file in /tmp/provider-smoke-*.json /tmp/provider-smoke-*.err; do
            [ -f "$file" ] || continue
            cp "$file" smoke-artifacts/
          done

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: provider-smoke-${{ inputs.provider }}-${{ github.run_id }}
          path: smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7
